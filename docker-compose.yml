version: "3.9"

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: tq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: timequest
      POSTGRES_PASSWORD: timequest_dev
      POSTGRES_DB: timequest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timequest -d timequest"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: tq-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: tq-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: timequest
      MINIO_ROOT_PASSWORD: timequest_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/ready && exit 0 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: tq-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 timequest timequest_dev_secret;
        mc mb local/timequest-media --ignore-existing;
        mc anonymous set download local/timequest-media/public;
        echo 'MinIO bucket ready.';
      "

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tq-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant
      - minio
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://timequest:timequest_dev@postgres:5432/timequest
      DATABASE_URL_SYNC: postgresql://timequest:timequest_dev@postgres:5432/timequest
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


networks:
  default:
    name: timequest

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
